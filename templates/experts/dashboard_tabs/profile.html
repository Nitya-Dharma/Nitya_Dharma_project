{% if success %}
    <div class="alert alert-success">
        Profile updated successfully.
    </div>
{% endif %}
{% if profile_error %}
    <div class="alert alert-danger">
        {{ profile_error }}
    </div>
{% endif %}

<div class="premium-card p-4">
    <h5 class="mb-3">Edit Profile</h5>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="tab" value="profile">

        <div class="mb-3">
            <label class="form-label">Profile Image</label>
            <input type="file" name="profile_image" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
            <label class="form-label">Cover Image</label>
            <input type="file" name="cover_image" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" value="{{ expert.name }}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" value="{{ expert.phone }}" class="form-control">
            <small class="text-muted">Used for call and WhatsApp contact.</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Experience</label>
            <input type="number" name="experience_years" value="{{ expert.experience_years }}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ expert.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Services Offered</label>
            <div class="row">
                {% for service in available_services %}
                    <div class="col-12 col-md-4 mb-2">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="services"
                                   value="{{ service.id }}"
                                   id="profile_service_{{ service.id }}"
                                   {% if service.id in selected_service_ids %}checked{% endif %}>
                            <label class="form-check-label" for="profile_service_{{ service.id }}">
                                {{ service.name }}
                            </label>
                        </div>
                    </div>
                {% endfor %}
            </div>
            <small class="text-muted">Select at least one service.</small>
        </div>

        <button type="submit" class="btn btn-danger">Update Profile</button>
    </form>
</div>
