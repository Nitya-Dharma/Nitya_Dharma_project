<div class="card h-100 shadow-sm">
  {% if bureau.profile_image %}
    <img src="{{ bureau.profile_image.url }}"
         class="card-img-top nd-img-cover-h-200"
         alt="{{ bureau.bureau_name }}"
         loading="lazy"
         decoding="async">
  {% else %}
    <img src="/static/images/default.png"
         class="card-img-top nd-img-cover-h-200"
         alt="No image"
         loading="lazy"
         decoding="async">
  {% endif %}

  <div class="card-body d-flex flex-column">
    <h5 class="card-title mb-1">{{ bureau.bureau_name|default:"-" }}</h5>
    <p class="text-muted mb-2">{{ bureau.city|default:"-" }}</p>
    <p class="small text-muted mb-3">{{ bureau.description|default:""|truncatechars:120 }}</p>

    {% url 'bureaus:bureau_detail' bureau.public_id as bureau_detail_url %}
    <div class="mt-auto">
      <a href="{{ bureau_detail_url }}" class="btn btn-danger w-100">
        View Profile
      </a>
    </div>
  </div>
</div>
