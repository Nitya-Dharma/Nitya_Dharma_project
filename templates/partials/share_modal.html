{# Reusable Instagram-style share modal. Populated by share.js from data-share-* on trigger. #}
<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title" id="shareModalLabel">
                    <i class="bi bi-share me-2"></i>Share
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item list-group-item-action share-option d-flex align-items-center gap-3 py-3" data-platform="copy_link" role="button">
                        <span class="share-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: #e9ecef;">
                            <i class="bi bi-link-45deg fs-5"></i>
                        </span>
                        <span>Copy Link</span>
                    </li>
                    <li class="list-group-item list-group-item-action share-option d-flex align-items-center gap-3 py-3" data-platform="whatsapp" role="button">
                        <span class="share-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: #25D366; color: white;">
                            <i class="bi bi-whatsapp fs-5"></i>
                        </span>
                        <span>WhatsApp</span>
                    </li>
                    <li class="list-group-item list-group-item-action share-option d-flex align-items-center gap-3 py-3" data-platform="facebook" role="button">
                        <span class="share-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: #1877F2; color: white;">
                            <i class="bi bi-facebook fs-5"></i>
                        </span>
                        <span>Facebook</span>
                    </li>
                    <li class="list-group-item list-group-item-action share-option d-flex align-items-center gap-3 py-3" data-platform="twitter" role="button">
                        <span class="share-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: #000000; color: white;">
                            <i class="bi bi-twitter fs-5"></i>
                        </span>
                        <span>X (Twitter)</span>
                    </li>
                    <li class="list-group-item list-group-item-action share-option d-flex align-items-center gap-3 py-3" data-platform="email" role="button">
                        <span class="share-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: #6c757d; color: white;">
                            <i class="bi bi-envelope fs-5"></i>
                        </span>
                        <span>Email</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
