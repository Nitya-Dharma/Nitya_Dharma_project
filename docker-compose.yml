# Nitya Dharma — Docker Compose (additive; does not replace existing VPS setup)
# Usage: docker-compose up -d
# Then: docker-compose exec web python manage.py migrate
#       docker-compose exec web python manage.py collectstatic --noinput
#
# In .env set DB_HOST=db (or DATABASE_HOST=db) so Django reaches MySQL.
# MySQL container: use DATABASE_NAME/DB_NAME, DATABASE_USER/DB_USER, DATABASE_PASSWORD/DB_PASSWORD (either set works).

version: "3.8"

services:
  web:
    build: .
    container_name: django_app
    command:
      - sh
      - -c
      - >-
        python /app/deployment/wait_for_mysql.py
        && exec gunicorn nityadharma.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/logs
    ports:
      - "8000:8000"
    env_file:
      - ${DJANGO_ENV_FILE:-.env}
    environment:
      # DJANGO_SETTINGS_MODULE: set in .env (env_file) so local/prod stays in one place
      - DATABASE_HOST=db
      - DB_HOST=db
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    # Optional: expose MySQL for local debugging only (disable in production)
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-${DB_NAME}}
      MYSQL_USER: ${DATABASE_USER:-${DB_USER}}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-${DB_PASSWORD}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DATABASE_PASSWORD:-${DB_PASSWORD}}}
    volumes:
      - mysql_data:/var/lib/mysql
    # Internal only; do not expose 3306 to host in production

volumes:
  mysql_data:
  static_volume:
  media_volume:
  logs_volume:
