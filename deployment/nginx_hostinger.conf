# Nginx configuration for Nitya Dharma on Hostinger KVM2 VPS
# Replace yourdomain.com with your actual domain.
# Install: sudo cp deployment/nginx_hostinger.conf /etc/nginx/sites-available/nityadharma
# Enable: sudo ln -s /etc/nginx/sites-available/nityadharma /etc/nginx/sites-enabled/
# Test:  sudo nginx -t && sudo systemctl reload nginx

upstream gunicorn_nityadharma {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    client_max_body_size 20M;

    # Gzip compression — smaller responses, faster page loads
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # After SSL is enabled, uncomment to redirect HTTP -> HTTPS:
    # return 301 https://$server_name$request_uri;

    root /var/www/nityadharma;

    # Static files (CSS, JS, images, fonts) — browser cache for repeat visitors
    location /static/ {
        alias /var/www/nityadharma/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media files (user uploads)
    location /media/ {
        alias /var/www/nityadharma/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Django app via Gunicorn
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://gunicorn_nityadharma;
    }
}

