<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pandit Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Test Pandit Registration Endpoint</h1>
    <p class="info">
        <strong>Note:</strong> This is a test page for the backend registration endpoint.<br>
        Endpoint: <code>POST /accounts/pandit/register/&lt;referral_token&gt;/</code>
    </p>
    
    <form id="registrationForm">
        <div class="form-group">
            <label for="referral_token">Referral Token (from URL):</label>
            <input type="text" id="referral_token" value="test-token-123" required>
            <small>This would normally come from the URL path</small>
        </div>
        
        <div class="form-group">
            <label for="referral_code">Referral Code:</label>
            <input type="text" id="referral_code" value="abc123" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="pandit@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
        
        <div class="form-group">
            <label for="first_name">First Name (optional):</label>
            <input type="text" id="first_name">
        </div>
        
        <div class="form-group">
            <label for="last_name">Last Name (optional):</label>
            <input type="text" id="last_name">
        </div>
        
        <button type="submit">Register Pandit</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const referralToken = document.getElementById('referral_token').value;
            const referralCode = document.getElementById('referral_code').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Registering...</p>';
            
            try {
                const response = await fetch(`/accounts/pandit/register/${referralToken}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        referral_code: referralCode,
                        email: email,
                        password: password,
                        first_name: firstName,
                        last_name: lastName
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Registration Successful!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p><strong>Note:</strong> User created with role='pandit', status='pending', is_active=False</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Registration Failed</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
