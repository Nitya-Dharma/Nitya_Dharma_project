# Manual-only CI: disposable MySQL 8 QA for restored migrations + selected
# ZeptoMail-related app paths. Preserves the separate DB-free workflow unchanged.
#
# Safety:
# - No production/Hostinger credentials or hosts.
# - QA host must be the ephemeral service alias "mysql" (never localhost).
# - Locmem email + mock OTP; no real SMTP/SMS/ZeptoMail.
# - Explicit migrate/showmigrations/--check on disposable QA_DB_NAME (nd_ci_qa).
# - Django TestCase runner separately creates/destroys QA_DB_TEST_NAME on the
#   same MySQL service. Do not point this job at any durable database.
#
# Creating this file does not authorize running the workflow.

name: ZeptoMail MySQL QA (disposable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-qa:
    name: Selected TestCase paths on disposable MySQL
    runs-on: ubuntu-latest

    # Container job so the MySQL service is reachable as hostname "mysql"
    # (required by nityadharma.settings.qa host allowlist; localhost is rejected).
    container:
      image: python:3.11-bookworm

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nd_ci_qa
          MYSQL_USER: nd_ci_user
          MYSQL_PASSWORD: ci-only-disposable-mysql-user-not-prod
          MYSQL_ROOT_PASSWORD: ci-only-disposable-mysql-root-not-prod
        # No persistent volumes — data discarded when the job ends.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-disposable-mysql-root-not-prod"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: nityadharma.settings.qa
      QA_SECRET_KEY: ci-mysql-qa-secret-not-for-production
      QA_DB_ENGINE: django.db.backends.mysql
      # DB name must not be forbidden (nityadharma_db, mysql, …).
      QA_DB_NAME: nd_ci_qa
      # Root is used only on this ephemeral service so Django can CREATE/DROP
      # the test database (QA_DB_TEST_NAME). Not a production credential.
      QA_DB_USER: root
      QA_DB_PASSWORD: ci-only-disposable-mysql-root-not-prod
      QA_DB_HOST: mysql
      QA_DB_PORT: "3306"
      QA_ALLOWED_DB_HOSTS: mysql
      QA_DB_TEST_NAME: test_nd_ci_qa
      OTP_MODE: mock
      OTP_PROVIDER: mock_sms
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      RESEND_API_KEY: ""
      REDIS_URL: ""
      DATABASE_URL: ""
      MYSQL_URL: ""
      MSG91_AUTH_KEY: ""
      SMS_API_KEY: ""

    steps:
      - name: Checkout workflow_dispatch ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use the dispatched branch/commit (candidate tip), not an obsolete pin.
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed — QA isolation guards
        shell: bash
        run: |
          set -euo pipefail
          test "${DJANGO_SETTINGS_MODULE}" = "nityadharma.settings.qa"
          test "${QA_DB_HOST}" = "mysql"
          test "${QA_ALLOWED_DB_HOSTS}" = "mysql"
          test "${QA_DB_NAME}" = "nd_ci_qa"
          test "${QA_DB_NAME}" != "nityadharma_db"
          test "${QA_DB_NAME}" != "mysql"
          test -z "${DATABASE_URL}"
          test -z "${MYSQL_URL}"
          test -z "${EMAIL_HOST_PASSWORD}"
          test -z "${RESEND_API_KEY}"
          test -z "${REDIS_URL}"
          test -z "${MSG91_AUTH_KEY}"
          test -z "${SMS_API_KEY}"
          test "${QA_DB_HOST}" != "localhost"
          test "${QA_DB_HOST}" != "127.0.0.1"

      - name: Install system packages for mysqlclient
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            default-mysql-client \
            pkg-config

      - name: Wait for disposable MySQL service
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if mysqladmin ping -h mysql -uroot -p"${QA_DB_PASSWORD}" --silent; then
              echo "MySQL service ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL service failed health wait" >&2
          exit 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned feature snapshot predates main's requests>=2.31.0 declaration.
          pip install 'requests>=2.31.0'

      - name: Explicit restored-migration QA on disposable MySQL
        shell: bash
        run: |
          set -euo pipefail
          # Discover the four restored migration modules from the checkout tree.
          # Path prefixes only; exact filenames come from glob (one match each).
          declare -a RESTORED_FILES=()
          for pattern in \
            "branding/migrations/0002_"*.py \
            "masterdata/migrations/0002_"*.py \
            "pages/migrations/0004_"*.py \
            "profiles/migrations/0009_"*.py
          do
            # shellcheck disable=SC2206
            matches=( ${pattern} )
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "FAIL: expected exactly one restored migration for pattern ${pattern}" >&2
              printf ' matches: %s\n' "${matches[@]-}" >&2
              exit 1
            fi
            RESTORED_FILES+=("${matches[0]}")
          done
          test "${#RESTORED_FILES[@]}" -eq 4
          echo "RESTORED_MIGRATION_FILES_DISCOVERED:"
          printf ' - %s\n' "${RESTORED_FILES[@]}"
          RESTORED_MIGRATION_FILES="$(printf '%s\n' "${RESTORED_FILES[@]}")"
          export RESTORED_MIGRATION_FILES

          # 1) Plan against disposable QA_DB_NAME (nd_ci_qa) — full output in Actions log.
          python manage.py migrate --plan

          # 2) Apply for real (no --fake / --fake-initial).
          python manage.py migrate --noinput

          # 3) Show status for the four apps (Actions log).
          python manage.py showmigrations branding masterdata pages profiles \
            | tee /tmp/zeptomail-restored-showmigrations.txt

          # 4) Assert each discovered restored migration is marked applied [X].
          python - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import re
          import sys

          show_path = pathlib.Path("/tmp/zeptomail-restored-showmigrations.txt")
          show = show_path.read_text(encoding="utf-8")
          files = [pathlib.Path(p) for p in os.environ["RESTORED_MIGRATION_FILES"].splitlines() if p.strip()]
          if len(files) != 4:
              raise SystemExit(f"FAIL: expected 4 restored files, got {len(files)}: {files}")

          missing: list[str] = []
          for path in files:
              if not path.is_file():
                  raise SystemExit(f"FAIL: restored migration missing on disk: {path}")
              app = path.parts[0]
              stem = path.stem
              applied = re.search(rf"(?m)^\s*\[X\]\s+{re.escape(stem)}\s*$", show)
              if applied is None:
                  missing.append(f"{app}.{stem} (file={path})")

          if missing:
              print("FAIL: restored migrations not marked [X]:", file=sys.stderr)
              for item in missing:
                  print(f" - {item}", file=sys.stderr)
              print("--- showmigrations output ---", file=sys.stderr)
              print(show, file=sys.stderr)
              raise SystemExit(1)

          print("RESTORED_MIGRATIONS_APPLIED_OK")
          for path in files:
              print(f" [X] {path.parts[0]}.{path.stem}")
          PY

          # 5) Fail if unapplied migrations remain.
          python manage.py migrate --check

          # 6) Fail if model state would require new migrations.
          python manage.py makemigrations --check --dry-run

          echo "EXPLICIT_RESTORED_MIGRATION_QA_OK"

      - name: Run selected Django TestCase modules on disposable MySQL
        shell: bash
        run: |
          set -euo pipefail
          # Prefer test-runner-managed test DB (creates/destroys QA_DB_TEST_NAME
          # on host "mysql"). Do not migrate a durable app DB separately.
          #
          # Allowlist (TestCase + mocked/locmem email; mock OTP where used):
          # - services.tests.test_expert_email_urls
          #     Expert registration email URL/recipient behavior (patches send_mail).
          # - accounts.test_pandit_registration_otp_skip
          #     Pandit registration OTP skip/gate paths with locmem email + OTP mocks.
          # Excludes password-reset rate-limit-exceeded paths (LocMem cache.ttl gap).
          python manage.py test \
            services.tests.test_expert_email_urls \
            accounts.test_pandit_registration_otp_skip \
            -v 2
