# Manual-only: build and verify ZeptoMail app image off-production.
# Retains a private Actions artifact (docker save + SHA-256). No registry push.
# Does NOT deploy, migrate, or use production credentials/DB/Redis.

name: ZeptoMail image build (DB-free, private artifact)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: zeptomail-image-build-32c67d5
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify isolated image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 32c67d51b279ec8b021034282892f42ff07c3243
          persist-credentials: false

      - name: Verify checked-out source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="32c67d51b279ec8b021034282892f42ff07c3243"
          test "$actual" = "$expected"
          echo "SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          test -f Dockerfile
          test -f core/email_providers.py
          test -f core/tasks_email.py
          test -f nityadharma/settings/_zeptomail_env.py

      - name: Build image on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag nitya-dharma:zeptomail-32c67d5 .
          docker image inspect nitya-dharma:zeptomail-32c67d5 \
            --format 'IMAGE_ID={{.Id}}' | tee image-id.txt
          cat image-id.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image contents and Python imports without network
        shell: bash
        run: |
          set -euo pipefail

          # Quoting: outer double-quoted sh -c; inner python -c uses single quotes.
          docker run --rm --network none --entrypoint sh \
            nitya-dharma:zeptomail-32c67d5 -c "
              set -eu
              test -f /app/core/email_providers.py || { echo 'FAIL: missing email_providers.py' >&2; exit 1; }
              test -f /app/core/tasks_email.py || { echo 'FAIL: missing tasks_email.py' >&2; exit 1; }
              test -f /app/nityadharma/settings/_zeptomail_env.py || { echo 'FAIL: missing _zeptomail_env.py' >&2; exit 1; }
              command -v gunicorn >/dev/null || { echo 'FAIL: gunicorn missing' >&2; exit 1; }
              command -v celery >/dev/null || { echo 'FAIL: celery missing' >&2; exit 1; }
              python -c 'import django; print(\"DJANGO_IMPORT_OK\")'
            "

          # Disposable prod-settings checks: network none; non-routable DB; empty ZeptoMail allowlist.
          # LOG_DIR under /tmp avoids relying on /logs writability in CI.
          # DJANGO_SETTINGS_MODULE must be prod before WSGI import (wsgi.py setdefault would otherwise pick .dev).
          docker run --rm --network none --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=nityadharma.settings.prod \
            -e SECRET_KEY=ci-only-not-a-production-secret \
            -e LOG_DIR=/tmp/nitya-dharma-ci-logs \
            -e DATABASE_NAME=nitya_ci_unused \
            -e DATABASE_USER=nitya_ci_unused \
            -e DATABASE_PASSWORD=ci-only-unused \
            -e DATABASE_HOST=qa-db.invalid \
            -e DATABASE_PORT=3306 \
            -e EMAIL_HOST= \
            -e EMAIL_HOST_USER= \
            -e EMAIL_HOST_PASSWORD= \
            -e RESEND_API_KEY= \
            -e ZEPTOMAIL_ENABLED_FLOWS= \
            -e REDIS_URL= \
            -e CELERY_BROKER_URL= \
            nitya-dharma:zeptomail-32c67d5 -c '
          import os
          import sys

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "nityadharma.settings.prod")
          import django
          try:
              django.setup()
          except Exception as e:
              print("FAIL: django.setup():", e, file=sys.stderr)
              raise

          from django.conf import settings
          from nityadharma.settings._zeptomail_env import parse_zeptomail_enabled_flows
          import core.email_providers  # noqa: F401

          assert parse_zeptomail_enabled_flows("") == frozenset()
          assert settings.ZEPTOMAIL_ENABLED_FLOWS == frozenset(), settings.ZEPTOMAIL_ENABLED_FLOWS
          assert settings.EMAIL_BACKEND == "django.core.mail.backends.console.EmailBackend", settings.EMAIL_BACKEND

          from nityadharma.wsgi import application
          assert application is not None

          from nityadharma.celery import app as celery_app
          task_names = celery_app.tasks.keys()
          assert "core.send_email_task" in task_names, sorted(
              n for n in task_names if "email" in n
          )

          print("DJANGO_SETUP_OK")
          print("WSGI_IMPORT_OK")
          print("CELERY_TASK_REGISTERED_OK")
          print("PRODUCTION_SETTINGS_IMPORT_OK")
          print("ZEPTOMAIL_ALLOWLIST_EMPTY_OK")
          print("DEFAULT_EMAIL_BACKEND_CONSOLE_OK")
          '

      - name: Save image archive and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect nitya-dharma:zeptomail-32c67d5 --format '{{.Id}}')"
          archive="nitya-dharma-zeptomail-32c67d5.tar.gz"
          checksum_file="${archive}.sha256"

          docker save nitya-dharma:zeptomail-32c67d5 | gzip -1 > "$archive"
          sha256sum "$archive" | tee "$checksum_file"
          archive_sha256="$(awk '{print $1}' "$checksum_file")"

          {
            echo "### Isolated image verification"
            echo "- Source commit: 32c67d51b279ec8b021034282892f42ff07c3243"
            echo "- Image tag: nitya-dharma:zeptomail-32c67d5"
            echo "- Image ID: $image_id"
            echo "- Archive file: $archive"
            echo "- Archive SHA-256: $archive_sha256"
            echo "- Archive retained/uploaded: **Yes (private Actions artifact)**"
            echo "- Public registry push: **No**"
            echo "- Deployment or production access: **No**"
            echo "- Database/Redis services: **None**"
            echo "- ZeptoMail allowlist: **Empty**"
            echo "- Artifact retention: **14 days**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "IMAGE_ID=$image_id" | tee image-build-meta.txt
          echo "SOURCE_SHA=32c67d51b279ec8b021034282892f42ff07c3243" >> image-build-meta.txt
          echo "IMAGE_TAG=nitya-dharma:zeptomail-32c67d5" >> image-build-meta.txt
          echo "ARCHIVE_SHA256=$archive_sha256" >> image-build-meta.txt
          ls -lh "$archive" "$checksum_file" image-id.txt image-build-meta.txt

      - name: Upload private image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeptomail-32c67d5-image
          path: |
            nitya-dharma-zeptomail-32c67d5.tar.gz
            nitya-dharma-zeptomail-32c67d5.tar.gz.sha256
            image-id.txt
            image-build-meta.txt
          if-no-files-found: error
          retention-days: 14
