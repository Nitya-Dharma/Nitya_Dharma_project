# Manual-only CI: database-free ZeptoMail email unit tests.
# Does NOT start MySQL/Redis/Celery. Does NOT use production secrets.
# Does NOT authorize automatic push/PR runs. Do not add deploy steps.
#
# Job dbfree-email: nityadharma.settings.qa (fail-closed). QA_DB_* values are
# non-routable placeholders required only so settings can import; the selected
# suite is SimpleTestCase with databases=set() and is invoked via unittest after
# django.setup() (not manage.py test / not pytest), so no test DB is created.
#
# Job additive-providers: accounts.tests.additive_email_test_settings (no QA DB).
# Separate job/process to avoid Django settings conflicts with qa.
#
# Checkout uses the branch tip selected at workflow_dispatch (no obsolete pin).
# Creating this file does not authorize executing the workflow.

name: ZeptoMail DB-free email tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbfree-email:
    name: accounts + bureau DB-free email tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: nityadharma.settings.qa
      # Harmless CI-only values — not production credentials.
      QA_SECRET_KEY: ci-only-dbfree-zeptomail-not-for-production
      QA_DB_ENGINE: django.db.backends.mysql
      QA_DB_NAME: ci_dbfree_placeholder_unused
      QA_DB_USER: ci_dbfree_user_unused
      QA_DB_PASSWORD: ci_dbfree_password_unused
      # RFC 2606 .invalid — non-routable; must match allowlist exactly.
      QA_DB_HOST: qa-dbfree.ci.invalid
      QA_DB_PORT: "3306"
      QA_ALLOWED_DB_HOSTS: qa-dbfree.ci.invalid
      OTP_MODE: mock
      OTP_PROVIDER: mock_sms
      # Keep email/SMS provider env empty (qa.py also forces locmem).
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      RESEND_API_KEY: ""
      REDIS_URL: ""
      DATABASE_URL: ""
      MYSQL_URL: ""
      MSG91_AUTH_KEY: ""
      SMS_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install mysqlclient build dependencies (client libs only; no MySQL server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Keep explicit requests pin for OTP HTTP import hardening.
          pip install 'requests>=2.31.0'

      - name: Run database-free ZeptoMail unittest suite
        run: |
          python - <<'PY'
          import unittest

          import django

          django.setup()

          suite = unittest.defaultTestLoader.loadTestsFromNames(
              [
                  "accounts.tests.test_zeptomail_email_dbfree",
                  "bureaus.test_bureau_approval_email_dbfree",
              ]
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  additive-providers:
    name: additive ZeptoMail provider unit tests (19)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: accounts.tests.additive_email_test_settings
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      RESEND_API_KEY: ""
      REDIS_URL: ""
      DATABASE_URL: ""
      MYSQL_URL: ""
      MSG91_AUTH_KEY: ""
      SMS_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install mysqlclient build dependencies (client libs only; no MySQL server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Keep explicit requests pin for OTP HTTP import hardening.
          pip install 'requests>=2.31.0'

      - name: Run additive ZeptoMail provider unittest suite
        run: python -m unittest accounts.tests.test_additive_zeptomail_providers -v
